name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gates:
    name: M0 / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, test, contract, plugin, audit, test-integration]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          go-tools: ${{ matrix.gate == 'lint' || matrix.gate == 'audit' }}
      - name: Run gate
        if: matrix.gate != 'test'
        run: node tools/tasks.mjs ${{ matrix.gate }}
      - name: Repository race tests and tooling regressions
        if: matrix.gate == 'test'
        run: node tools/tasks.mjs test-unit
      - name: Preserve minimized property and fuzz counterexamples
        if: failure() && matrix.gate == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: core-counterexamples-${{ matrix.gate }}
          path: |
            internal/**/testdata/rapid/**
            internal/**/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Integration diagnostics
        if: failure() && matrix.gate == 'test-integration'
        run: docker compose logs --tail=100
      - name: Stop development services, retain no CI volumes
        if: always() && matrix.gate == 'test-integration'
        run: docker compose down --volumes
  core:
    name: Core
    uses: ./.github/workflows/core.yml
    with:
      mode: pr
  verification:
    # Keep this required context stable as the discovered matrix grows.
    name: M0 / verification
    needs: core
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require all core matrix jobs
        env:
          CORE_RESULT: ${{ needs.core.result }}
        run: test "$CORE_RESULT" = success
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Generated fixtures have no drift
        run: node tools/tasks.mjs fixtures-check
      - name: Deterministic simulation (500 runs)
        run: node tools/tasks.mjs sim
      - name: Preserve minimized simulation counterexamples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-counterexamples-verification
          path: internal/**/testdata/rapid/**
          if-no-files-found: ignore
          retention-days: 30
  worker:
    name: M0 / worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and smoke-test phase 1 worker
        run: |
          docker build -t stele-pull-worker:ci .
          docker run --rm --read-only stele-pull-worker:ci help
          docker run --rm --read-only --tmpfs /tmp --entrypoint /usr/local/bin/stele-pull stele-pull-worker:ci -fs-store /tmp ls
      - name: Cross-compile phase 1 commands for Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build ./cmd/stele-pull ./cmd/stele-pull-worker
      - name: Cross-compile phase 1 commands for macOS
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build ./cmd/stele-pull ./cmd/stele-pull-worker
      - name: Render phase 1 deployments
        run: bash scripts/render-deploy.sh deploy/apps/garage-obsync deploy/apps/obsync-worker
